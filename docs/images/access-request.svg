<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" role="img" aria-labelledby="t d">
  <title id="t">Access request flow</title>
  <desc id="d">The app posts an access request and gets a request id and poll URL. The gateway shows the request to the user in the menu bar app. The app polls every 3 seconds and sees pending until the user approves, choosing chats and scopes; the next poll returns approved with the token and grant.</desc>
  <style>
    :root { --bg: #ffffff; --ink: #1f2328; --muted: #59636e; --frame: #d1d9e0; --box: #f6f8fa; --line: #59636e; --acc: #0969da; --acc-fill: rgba(9,105,218,0.08); }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d1117; --ink: #e6edf3; --muted: #9198a1; --frame: #3d444d; --box: #151b23; --line: #9198a1; --acc: #4493f8; --acc-fill: rgba(68,147,248,0.12); }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: var(--ink); }
    .bg { fill: var(--bg); stroke: var(--frame); stroke-width: 1.5; }
    .frame { fill: none; stroke: var(--frame); stroke-width: 1.5; }
    .zone { fill: var(--acc-fill); stroke: var(--acc); stroke-width: 1.5; }
    .box { fill: var(--box); stroke: var(--line); stroke-width: 1.2; }
    .key { fill: var(--bg); stroke: var(--acc); stroke-width: 2; }
    .ln { fill: none; stroke: var(--line); stroke-width: 1.5; }
    .dash { stroke-dasharray: 5 4; }
    .life { stroke: var(--frame); stroke-width: 1.5; stroke-dasharray: 3 4; }
    .head { fill: var(--line); }
    .b { font-weight: 600; font-size: 14px; }
    .m { fill: var(--muted); }
    .s { font-size: 12px; }
    .c { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    .zl { fill: var(--acc); font-weight: 600; }
    .halo { paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="1" y="1" width="758" height="478" rx="12"/>

  <path class="life" d="M110,64 V456"/>
  <path class="life" d="M380,64 V456"/>
  <path class="life" d="M640,64 V456"/>

  <rect class="box" x="40" y="20" width="140" height="44" rx="8"/>
  <text class="b" x="110" y="47" text-anchor="middle">App</text>
  <rect class="key" x="310" y="20" width="140" height="44" rx="8"/>
  <text class="b" x="380" y="47" text-anchor="middle">Gateway</text>
  <rect class="box" x="555" y="14" width="170" height="54" rx="8"/>
  <text class="b" x="640" y="37" text-anchor="middle">User</text>
  <text class="s m" x="640" y="56" text-anchor="middle">in the menu bar app</text>

  <path class="ln" d="M110,100 H377" marker-end="url(#arrow)"/>
  <text class="c halo" x="245" y="92" text-anchor="middle">POST /v1/access-requests</text>

  <path class="ln dash" d="M380,140 H113" marker-end="url(#arrow)"/>
  <text class="s halo" x="245" y="132" text-anchor="middle">request_id, poll_url, status <tspan class="c">pending</tspan></text>

  <path class="ln" d="M380,180 H637" marker-end="url(#arrow)"/>
  <text class="s halo" x="510" y="172" text-anchor="middle">“Community Analytics wants access”</text>

  <rect class="frame" x="70" y="202" width="350" height="110" rx="6"/>
  <text class="s m" x="122" y="222">loop · every 3s until the user answers</text>

  <path class="ln" d="M110,250 H377" marker-end="url(#arrow)"/>
  <text class="c halo" x="245" y="242" text-anchor="middle">GET /v1/access-requests/{id}</text>
  <path class="ln dash" d="M380,290 H113" marker-end="url(#arrow)"/>
  <text class="s halo" x="245" y="282" text-anchor="middle">status <tspan class="c">pending</tspan></text>

  <path class="ln" d="M640,350 H383" marker-end="url(#arrow)"/>
  <text class="s halo" x="510" y="342" text-anchor="middle">approve, choosing chats and scopes</text>

  <path class="ln" d="M110,392 H377" marker-end="url(#arrow)"/>
  <text class="c halo" x="245" y="384" text-anchor="middle">GET /v1/access-requests/{id}</text>
  <path class="ln dash" d="M380,432 H113" marker-end="url(#arrow)"/>
  <text class="s halo" x="245" y="424" text-anchor="middle">status <tspan class="c">approved</tspan>, token, grant</text>
</svg>

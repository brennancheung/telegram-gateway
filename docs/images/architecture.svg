<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" width="900" height="510" role="img" aria-labelledby="t d">
  <title id="t">How the gateway is put together</title>
  <desc id="d">Inside the gateway, TDLib feeds the translator, which writes numbered events to the event log, from which delivery sends each app what its grant allows. Telegram connects to TDLib over MTProto. The menu bar app and tgw use the admin token; apps use app tokens, both on 127.0.0.1:41414.</desc>
  <style>
    :root { --bg: #ffffff; --ink: #1f2328; --muted: #59636e; --frame: #d1d9e0; --box: #f6f8fa; --line: #59636e; --acc: #0969da; --acc-fill: rgba(9,105,218,0.08); }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d1117; --ink: #e6edf3; --muted: #9198a1; --frame: #3d444d; --box: #151b23; --line: #9198a1; --acc: #4493f8; --acc-fill: rgba(68,147,248,0.12); }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: var(--ink); }
    .bg { fill: var(--bg); stroke: var(--frame); stroke-width: 1.5; }
    .frame { fill: none; stroke: var(--frame); stroke-width: 1.5; }
    .zone { fill: var(--acc-fill); stroke: var(--acc); stroke-width: 1.5; }
    .box { fill: var(--box); stroke: var(--line); stroke-width: 1.2; }
    .key { fill: var(--bg); stroke: var(--acc); stroke-width: 2; }
    .ln { fill: none; stroke: var(--line); stroke-width: 1.5; }
    .dash { stroke-dasharray: 5 4; }
    .life { stroke: var(--frame); stroke-width: 1.5; stroke-dasharray: 3 4; }
    .head { fill: var(--line); }
    .b { font-weight: 600; font-size: 14px; }
    .m { fill: var(--muted); }
    .s { font-size: 12px; }
    .c { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    .zl { fill: var(--acc); font-weight: 600; }
    .halo { paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="1" y="1" width="898" height="508" rx="12"/>

  <rect class="box" x="60" y="24" width="160" height="52" rx="26"/>
  <text class="b" x="140" y="55" text-anchor="middle">Telegram</text>

  <rect class="box" x="540" y="20" width="280" height="64" rx="8"/>
  <text class="b" x="680" y="45" text-anchor="middle">Menu bar app, <tspan class="c">tgw</tspan></text>
  <text class="m" x="680" y="67" text-anchor="middle">sign in, pick chats, approve and revoke</text>

  <rect class="zone" x="20" y="150" width="860" height="176" rx="12"/>
  <text class="zl" x="36" y="312">The gateway <tspan class="m" font-weight="400">— GatewayDaemon, a launchd LaunchAgent</tspan></text>

  <rect class="box" x="50" y="196" width="180" height="90" rx="8"/>
  <text class="b" x="140" y="232" text-anchor="middle">TDLib</text>
  <text class="m" x="140" y="254" text-anchor="middle">login, chat cache</text>

  <rect class="box" x="260" y="196" width="180" height="90" rx="8"/>
  <text class="b" x="350" y="224" text-anchor="middle">Translator</text>
  <text class="m" x="350" y="246" text-anchor="middle">TDLib JSON → the</text>
  <text class="m" x="350" y="264" text-anchor="middle">gateway's own format</text>

  <rect class="key" x="470" y="196" width="180" height="90" rx="8"/>
  <text class="b" x="560" y="224" text-anchor="middle">Event log</text>
  <text class="m" x="560" y="246" text-anchor="middle">SQLite,</text>
  <text class="m" x="560" y="264" text-anchor="middle">numbered events</text>

  <rect class="box" x="680" y="196" width="180" height="90" rx="8"/>
  <text class="b" x="770" y="224" text-anchor="middle">Delivery</text>
  <text class="m" x="770" y="246" text-anchor="middle">grants choose</text>
  <text class="m" x="770" y="264" text-anchor="middle">who gets what</text>

  <path class="ln" d="M232,241 H258" marker-end="url(#arrow)"/>
  <path class="ln" d="M442,241 H468" marker-end="url(#arrow)"/>
  <path class="ln" d="M652,241 H678" marker-end="url(#arrow)"/>

  <path class="ln" d="M140,78 V194" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="s m halo" x="152" y="124">MTProto, Telegram's protocol</text>

  <path class="ln" d="M680,86 V148" marker-end="url(#arrow)"/>
  <text class="s m halo" x="692" y="114">admin token</text>
  <text class="s c m halo" x="692" y="130">127.0.0.1:41414</text>

  <rect class="box" x="540" y="390" width="340" height="100" rx="8"/>
  <text class="b" x="560" y="416">Apps</text>
  <text x="560" y="438"><tspan class="s m">WebSocket</tspan><tspan class="c" x="640">GET /v1/events/stream</tspan></text>
  <text x="560" y="458"><tspan class="s m">HTTP</tspan><tspan class="c" x="640">GET /v1/events, …</tspan></text>
  <text x="560" y="478"><tspan class="s m">webhooks</tspan><tspan class="c" x="640">POST to the app's URL</tspan></text>

  <path class="ln" d="M770,288 V388" marker-end="url(#arrow)"/>
  <text class="s m halo" x="758" y="354" text-anchor="end">app tokens</text>
  <text class="s c m halo" x="758" y="370" text-anchor="end">127.0.0.1:41414</text>
</svg>

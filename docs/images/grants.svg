<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t d">
  <title id="t">What an app can see</title>
  <desc id="d">Of every chat the account can see, the user monitors some. Each app is granted some chats and sees only the part of its grant that is also monitored. Chats outside the monitored set are never stored or delivered.</desc>
  <style>
    :root { --bg: #ffffff; --ink: #1f2328; --muted: #59636e; --frame: #d1d9e0; --mon: #0969da; --mon-fill: rgba(9,105,218,0.08); --grant: #6e7781; --eff: rgba(26,127,55,0.28); --eff-ink: #1a7f37; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d1117; --ink: #e6edf3; --muted: #9198a1; --frame: #3d444d; --mon: #4493f8; --mon-fill: rgba(68,147,248,0.12); --grant: #9198a1; --eff: rgba(63,185,80,0.32); --eff-ink: #3fb950; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
    .frame { fill: var(--bg); stroke: var(--frame); stroke-width: 1.5; }
    .mon { fill: var(--mon-fill); stroke: var(--mon); stroke-width: 2; }
    .grant { fill: none; stroke: var(--grant); stroke-width: 1.5; stroke-dasharray: 6 4; }
    .eff { fill: var(--eff); }
    .h { font-size: 15px; font-weight: 600; }
    .l { font-size: 13px; }
    .m { font-size: 13px; fill: var(--muted); }
    .mon-l { font-size: 14px; font-weight: 600; fill: var(--mon); }
    .eff-l { font-size: 13px; font-weight: 600; fill: var(--eff-ink); }
  </style>
  <defs>
    <clipPath id="monitored"><ellipse cx="360" cy="195" rx="190" ry="130"/></clipPath>
  </defs>

  <rect class="frame" x="10" y="10" width="700" height="380" rx="12"/>
  <text class="h" x="30" y="38">Every chat the user's account can see</text>

  <ellipse class="mon" cx="360" cy="195" rx="190" ry="130"/>
  <text class="mon-l" x="360" y="92" text-anchor="middle">Monitored</text>
  <text class="m" x="360" y="110" text-anchor="middle">the user's choice, one set for all apps</text>

  <g clip-path="url(#monitored)">
    <circle class="eff" cx="190" cy="205" r="100"/>
    <circle class="eff" cx="530" cy="205" r="100"/>
  </g>
  <circle class="grant" cx="190" cy="205" r="100"/>
  <circle class="grant" cx="530" cy="205" r="100"/>

  <text class="l" x="128" y="200" text-anchor="middle">Granted</text>
  <text class="l" x="128" y="217" text-anchor="middle">to app A</text>
  <text class="eff-l" x="232" y="200" text-anchor="middle">App A</text>
  <text class="eff-l" x="232" y="217" text-anchor="middle">sees these</text>

  <text class="l" x="592" y="200" text-anchor="middle">Granted</text>
  <text class="l" x="592" y="217" text-anchor="middle">to app B</text>
  <text class="eff-l" x="488" y="200" text-anchor="middle">App B</text>
  <text class="eff-l" x="488" y="217" text-anchor="middle">sees these</text>

  <text class="m" x="360" y="365" text-anchor="middle">Outside the monitored set, including private chats: never stored, never delivered to any app</text>
</svg>
